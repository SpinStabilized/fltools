[project]
name = "fltools"
version = "0.1.0"
description = "Extra macro tools for FLDigi: push the selected log entry to QRZ or Club Log, and pull local weather onto the air."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Brian McLaughlin (N3BMC)", email = "n3bmc@arrl.net" },
]
keywords = [
    "fldigi",
    "amateur-radio",
    "ham-radio",
    "adif",
    "qrz",
    "clublog",
    "logging",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Ham Radio",
]
dependencies = [
    "maidenhead>=1.8.0",
    "platformdirs>=4.0.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[project.urls]
Homepage = "https://github.com/SpinStabilized/fltools"
Repository = "https://github.com/SpinStabilized/fltools"
Issues = "https://github.com/SpinStabilized/fltools/issues"

[project.scripts]
fltools = "fltools.cli:main"

# Any PEP 517 backend works here. Swap in setuptools, flit-core, or uv's own
# uv_build if you prefer. hatchling auto-detects src/fltools/ because the
# directory name matches the project name, so it needs no further config.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "black>=25.1.0",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "ruff>=0.9.0",
    "types-requests>=2.33.0.20260906",
    "vermin>=1.6.0",
]

[tool.black]
target-version = ["py310"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# maidenhead ships no py.typed marker and has no stubs on typeshed.
module = ["maidenhead"]
ignore_missing_imports = true
