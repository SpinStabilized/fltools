[project]
name = "fltools"
version = "0.1.0"
description = "Extra macro tools for FLDigi: push the selected log entry to QRZ or Club Log, and pull local weather onto the air."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "YOUR NAME", email = "you@example.com" },
]
keywords = [
    "fldigi",
    "amateur-radio",
    "ham-radio",
    "adif",
    "qrz",
    "clublog",
    "logging",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Ham Radio",
]
dependencies = [
    "maidenhead>=1.8.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[project.urls]
Homepage = "https://github.com/SpinStabilized/fltools"
Repository = "https://github.com/SpinStabilized/fltools"
Issues = "https://github.com/SpinStabilized/fltools/issues"

[project.scripts]
fltools = "fltools.cli:main"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=25.1.0",
    "ruff>=0.9.0",
    "vermin>=1.6.0",
]

[tool.black]
target-version = ["py310"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]